version: "3"
services:
  api:
    image: license-server:prod
    container_name: license-server
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app/backend
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "80"]
    env_file:
      - .env
    ports:
      - "8999:80"

[tool.poetry]
name = "SkyTech-Scripts"
version = "0.0.2"
description = "Runner for custom scripts."
authors = ["SkyTechSoftware"]

[tool.poetry.dependencies]
python = "3.12.2"
fastapi = "0.104.0"
pydantic-settings = "2.0.3"
pydantic = "2.6.1"
python-multipart = "0.0.6"
uvicorn = "0.20.0"
gunicorn = "20.1.0"
fonttools = "4.49.0"

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'

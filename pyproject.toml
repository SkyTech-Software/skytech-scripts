[tool.poetry]
name = "SkyTech-Scripts"
version = "0.0.3"
description = "Runner for custom scripts."
authors = ["SkyTechSoftware"]

[tool.poetry.dependencies]
python = "3.12.2"
fastapi = "0.104.0"
pydantic-settings = "2.0.3"
pydantic = "2.6.1"
python-multipart = "0.0.9"
uvicorn = "0.28.0"
gunicorn = "21.2.0"
fonttools = "4.49.0"
beautifulsoup4 = "4.12.3"
requests = "2.31.0"
pandas = "2.2.1"
redis = "5.0.3"
celery = "5.3.6"
gevent = "24.2.1"
boto3 = "1.34.69"
sqlmodel = "0.0.16"
psycopg2-binary = "2.9.9"
pytz = "2024.1"

[tool.poetry.dev-dependencies]
watchdog = "4.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'

version: "3"
services:
  api:
    image: skytech-scripts:local
    container_name: skytech-scripts
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./backend:/app/backend
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "80", "--reload",  "--reload-dir", "/app"]
    env_file:
      - .env
    ports:
      - "8020:80"
    networks:
      - redis_network
      - postgres
    depends_on:
      - db
  redis:
    image: redis:7.2.4
    container_name: redis
    networks:
      - redis_network
    env_file:
      - .env
    ports:
      - "6379:6379"


  celery-worker:
    build:
        context: .
        dockerfile: Dockerfile
        target: development
    command: sh /app/start-celery-worker.sh
    networks:
      - redis_network
      - postgres

    depends_on:
      - redis
      - db
    volumes:
      - ./backend:/app/backend
    env_file:
      - .env

  db:
      image: postgres:16
      container_name: postgres-db
      environment:
        - POSTGRES_USER=user
        - POSTGRES_PASSWORD=password
        - POSTGRES_DB=software-skytech
      ports:
        - "5432:5432"
      volumes:
        - db-data:/var/lib/postgresql/data
      networks:
        - postgres

volumes:
  db-data: {}

networks:
  redis_network:
    name: redis_network
  postgres:
    name: postgres

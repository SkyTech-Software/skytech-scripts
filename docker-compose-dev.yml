version: "3"
services:
  api:
    image: skytech-scripts:local
    container_name: skytech-scripts
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./backend:/app/backend
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "80", "--reload",  "--reload-dir", "/app"]
    env_file:
      - .env
    ports:
      - "8020:80"
    networks:
      - redis_network

  redis:
    image: redis:7.2.4
    container_name: redis
    networks:
      - redis_network
    env_file:
      - .env
    ports:
      - "6379:6379"


  celery-worker:
    build:
        context: .
        dockerfile: Dockerfile
        target: development
    command: sh /app/start-celery-worker.sh
    networks:
      - redis_network
    depends_on:
      - redis
    volumes:
      - ./backend:/app/backend
    env_file:
      - .env

networks:
  redis_network:
    name: redis_network
